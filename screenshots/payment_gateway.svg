  <text x="375" y="518" fill="#64748b" font-family="Arial" font-size="11"><tspan font-weight="bold">Account:</tspan> 1234567890</text>
  <text x="375" y="536" fill="#64748b" font-family="Arial" font-size="11"><tspan font-weight="bold">Reference:</tspan> S101</text>
  <text x="375" y="554" fill="#ef4444" font-family="Arial" font-size="11"><tspan font-weight="bold">Amount:</tspan> UGX 1,140,000</text>
