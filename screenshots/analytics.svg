<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#f0f2f5"/>
  <text x="30" y="35" fill="#1e293b" font-family="Arial" font-size="20" font-weight="bold">Advanced Payment Analytics</text>
  <text x="30" y="55" fill="#64748b" font-family="Arial" font-size="12">Comprehensive insights into school payment collections and trends</text>

  <!-- KPI Cards -->
  <rect x="30" y="75" width="175" height="85" rx="10" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="50" y="100" fill="#64748b" font-family="Arial" font-size="11">Total Collections</text>
  <text x="50" y="135" fill="#10b981" font-family="Arial" font-size="22" font-weight="800">$8,275.00</text>
  <text x="50" y="152" fill="#64748b" font-family="Arial" font-size="10">22 transactions</text>

  <rect x="220" y="75" width="175" height="85" rx="10" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="240" y="100" fill="#64748b" font-family="Arial" font-size="11">Outstanding Balance</text>
  <text x="240" y="135" fill="#ef4444" font-family="Arial" font-size="22" font-weight="800">$4,230.00</text>
  <text x="240" y="152" fill="#64748b" font-family="Arial" font-size="10">20 pending</text>

  <rect x="410" y="75" width="175" height="85" rx="10" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="430" y="100" fill="#64748b" font-family="Arial" font-size="11">Recovery Rate</text>
  <text x="430" y="135" fill="#1e293b" font-family="Arial" font-size="22" font-weight="800">66.2%</text>
  <text x="430" y="152" fill="#64748b" font-family="Arial" font-size="10">Overall collection rate</text>

  <rect x="600" y="75" width="170" height="85" rx="10" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="620" y="100" fill="#64748b" font-family="Arial" font-size="11">Total Ledger</text>
  <text x="620" y="135" fill="#4f46e5" font-family="Arial" font-size="18" font-weight="800">$12,505.00</text>
  <text x="620" y="152" fill="#64748b" font-family="Arial" font-size="10">All fees tracked</text>

  <!-- Collection by Fee Type -->
  <rect x="30" y="180" width="370" height="390" rx="12" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="50" y="210" fill="#1e293b" font-family="Arial" font-size="14" font-weight="bold">Collection Breakdown by Fee Type</text>
  <!-- Table header -->
  <rect x="50" y="225" width="330" height="28" fill="#f8fafc"/>
  <text x="65" y="244" fill="#64748b" font-family="Arial" font-size="10" font-weight="bold">FEE TYPE</text>
  <text x="185" y="244" fill="#64748b" font-family="Arial" font-size="10" font-weight="bold">COLLECTED</text>
  <text x="270" y="244" fill="#64748b" font-family="Arial" font-size="10" font-weight="bold">PENDING</text>
  <text x="340" y="244" fill="#64748b" font-family="Arial" font-size="10" font-weight="bold">RATE</text>
  <!-- Tuition -->
  <line x1="50" y1="255" x2="380" y2="255" stroke="#f1f5f9" stroke-width="1"/>
  <text x="65" y="278" fill="#1e293b" font-family="Arial" font-size="11" font-weight="bold">Tuition Fee</text>
  <text x="185" y="278" fill="#10b981" font-family="Arial" font-size="11">$5,490.00</text>
  <text x="270" y="278" fill="#ef4444" font-family="Arial" font-size="11">$2,630.00</text>
  <rect x="330" y="268" width="60" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="330" y="268" width="40" height="8" rx="4" fill="#10b981"/>
  <text x="345" y="292" text-anchor="middle" fill="#1e293b" font-family="Arial" font-size="9" font-weight="bold">68%</text>
  <!-- Development -->
  <line x1="50" y1="300" x2="380" y2="300" stroke="#f1f5f9" stroke-width="1"/>
  <text x="65" y="320" fill="#1e293b" font-family="Arial" font-size="11" font-weight="bold">Development Fee</text>
  <text x="185" y="320" fill="#10b981" font-family="Arial" font-size="11">$960.00</text>
  <text x="270" y="320" fill="#ef4444" font-family="Arial" font-size="11">$350.00</text>
  <text x="345" y="320" text-anchor="middle" fill="#1e293b" font-family="Arial" font-size="9" font-weight="bold">73%</text>
  <!-- Sports -->
  <line x1="50" y1="345" x2="380" y2="345" stroke="#f1f5f9" stroke-width="1"/>
  <text x="65" y="365" fill="#1e293b" font-family="Arial" font-size="11" font-weight="bold">Sports Fee</text>
  <text x="185" y="365" fill="#10b981" font-family="Arial" font-size="11">$575.00</text>
  <text x="270" y="365" fill="#ef4444" font-family="Arial" font-size="11">$480.00</text>
  <text x="345" y="365" text-anchor="middle" fill="#1e293b" font-family="Arial" font-size="9" font-weight="bold">55%</text>
  <!-- School Meals -->
  <line x1="50" y1="390" x2="380" y2="390" stroke="#f1f5f9" stroke-width="1"/>
  <text x="65" y="410" fill="#1e293b" font-family="Arial" font-size="11" font-weight="bold">School Meals</text>
  <text x="185" y="410" fill="#10b981" font-family="Arial" font-size="11">$600.00</text>
  <text x="270" y="410" fill="#ef4444" font-family="Arial" font-size="11">$600.00</text>
  <text x="345" y="410" text-anchor="middle" fill="#1e293b" font-family="Arial" font-size="9" font-weight="bold">50%</text>
  <!-- Library -->
  <line x1="50" y1="435" x2="380" y2="435" stroke="#f1f5f9" stroke-width="1"/>
  <text x="65" y="455" fill="#1e293b" font-family="Arial" font-size="11" font-weight="bold">Library Fee</text>
  <text x="185" y="455" fill="#10b981" font-family="Arial" font-size="11">$195.00</text>
  <text x="270" y="455" fill="#ef4444" font-family="Arial" font-size="11">$170.00</text>
  <text x="345" y="455" text-anchor="middle" fill="#1e293b" font-family="Arial" font-size="9" font-weight="bold">53%</text>

  <!-- Payment Method Distribution -->
  <rect x="420" y="180" width="350" height="200" rx="12" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="440" y="210" fill="#1e293b" font-family="Arial" font-size="14" font-weight="bold">Payment Methods Used</text>
  <text x="440" y="235" fill="#64748b" font-family="Arial" font-size="11">Card</text>
  <text x="710" y="235" fill="#64748b" font-family="Arial" font-size="11">14 payments</text>
  <rect x="440" y="242" width="310" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="440" y="242" width="140" height="8" rx="4" fill="#4f46e5"/>
  <text x="440" y="268" fill="#64748b" font-family="Arial" font-size="11">Mobile Money</text>
  <text x="710" y="268" fill="#64748b" font-family="Arial" font-size="11">8 payments</text>
  <rect x="440" y="275" width="310" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="440" y="275" width="105" height="8" rx="4" fill="#4f46e5"/>
  <text x="440" y="301" fill="#64748b" font-family="Arial" font-size="11">Bank Transfer</text>
  <text x="710" y="301" fill="#64748b" font-family="Arial" font-size="11">6 payments</text>
  <rect x="440" y="308" width="310" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="440" y="308" width="80" height="8" rx="4" fill="#4f46e5"/>

  <!-- Top Outstanding Students -->
  <rect x="420" y="400" width="350" height="170" rx="12" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="440" y="430" fill="#1e293b" font-family="Arial" font-size="14" font-weight="bold">Top Students with Outstanding Balances</text>
  <rect x="440" y="440" width="310" height="25" fill="#f8fafc"/>
  <text x="455" y="458" fill="#64748b" font-family="Arial" font-size="9" font-weight="bold">STUDENT</text>
  <text x="545" y="458" fill="#64748b" font-family="Arial" font-size="9" font-weight="bold">PAID</text>
  <text x="610" y="458" fill="#64748b" font-family="Arial" font-size="9" font-weight="bold">OUTSTANDING</text>
  <!-- S110 -->
  <line x1="440" y1="467" x2="750" y2="467" stroke="#f1f5f9" stroke-width="1"/>
  <text x="455" y="484" fill="#1e293b" font-family="Arial" font-size="10" font-weight="bold">S110 - John Wasswa</text>
  <text x="545" y="484" fill="#10b981" font-family="Arial" font-size="10">$0.00</text>
  <text x="610" y="484" fill="#ef4444" font-family="Arial" font-size="10" font-weight="bold">$865.00</text>
  <!-- S116 -->
  <line x1="440" y1="495" x2="750" y2="495" stroke="#f1f5f9" stroke-width="1"/>
  <text x="455" y="510" fill="#1e293b" font-family="Arial" font-size="10" font-weight="bold">S116 - Queen Namusisi</text>
  <text x="545" y="510" fill="#10b981" font-family="Arial" font-size="10">$80.00</text>
  <text x="610" y="510" fill="#ef4444" font-family="Arial" font-size="10" font-weight="bold">$1,250.00</text>
  <!-- S106 -->
  <line x1="440" y1="520" x2="750" y2="520" stroke="#f1f5f9" stroke-width="1"/>
  <text x="455" y="536" fill="#1e293b" font-family="Arial" font-size="10" font-weight="bold">S106 - Fred Mugisha</text>
  <text x="545" y="536" fill="#10b981" font-family="Arial" font-size="10">$0.00</text>
  <text x="610" y="536" fill="#ef4444" font-family="Arial" font-size="10" font-weight="bold">$755.00</text>
  <!-- S104 -->
  <line x1="440" y1="545" x2="750" y2="545" stroke="#f1f5f9" stroke-width="1"/>
  <text x="455" y="560" fill="#1e293b" font-family="Arial" font-size="10" font-weight="bold">S104 - Denis Kizito</text>
  <text x="545" y="560" fill="#10b981" font-family="Arial" font-size="10">$75.00</text>
  <text x="610" y="560" fill="#ef4444" font-family="Arial" font-size="10" font-weight="bold">$650.00</text>
</svg>